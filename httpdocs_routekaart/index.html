[Je opleiding/studentnummer]`)}`},content:{inleiding:"Hieronder staat het standaard e-mailconcept. De geadresseerde (Aan:) is bewust leeg gelaten zodat je zelf je studentcoach, stagebegeleider of stagecoördinator kunt selecteren in Outlook.",punten:[{kop:"Direct in Outlook openen",tekst:'Klik op de knop "Open direct in Outlook" om de mail automatisch als concept in je Outlook (of standaard mail-app) te openen met onderwerp en tekst al ingevuld.'},{kop:"Aanhef en geadresseerde zelf invullen",tekst:'Vul bij "Aan:" het e-mailadres in van je begeleider en pas de aanhef aan naar diens naam (bijv. "Beste Sandra" of "Beste docent").'},{kop:"Volledig vertrouwelijk",tekst:"Een gesprek dient om rustig te verkennen hoe je hiermee om kunt gaan, te oefenen of samen opties te bespreken. Jij houdt altijd de regie."}],tips:['Gebruik je liever webmail? Klik op "Kopieer e-mailtekst" en plak het direct in je browser-mail.',"Vergeet niet je eigen naam, opleiding en studentnummer onderaan de e-mail in te vullen.","Binnen 5 werkdagen na je bericht plant je begeleider een gesprek met je in."],contactInfo:{naam:"Studentcoach, stagebegeleider of stagecoördinator",contact:"hint.hr.nl · Opleidingspagina",toelichting:"Jouw opleiding biedt binnen 5 werkdagen een vertrouwelijk gesprek aan."}}},hint:{id:"hint",title:"HINT-pagina Stagediscriminatie",subtitle:"Officiële informatie- en meldpagina van Hogeschool Rotterdam",badge:"HINT Portaal",externalUrl:{label:"Naar de HINT-pagina",url:"https://hint.hr.nl/nl/HR/Studie/keuzes-in-je-studie/Stage/stagediscriminatie/"},content:{inleiding:"Op de officiële HINT-themapagina van Hogeschool Rotterdam vind je uitgebreide achtergrondinformatie over gelijke stagekansen, herkenning van discriminatie en veilige meldroutes.",punten:[{kop:"Lees meer over stagediscriminatie",tekst:"Bekijk op HINT wat de wet en de Stagecode hbo zeggen over gelijke behandeling, objectieve werving en selectie, en een sociaal veilige leerwerkomgeving."},{kop:"Praat met iemand die je vertrouwt",tekst:"Bespreek je situatie in alle rust met een vriend, ouder, medestudent of docent/studentcoach. Je hoeft het niet alleen te verwerken of op te lossen."},{kop:"Directe ondersteuning en contact",tekst:"Via de HINT-pagina vind je rechtstreekse contactgegevens van vertrouwenspersonen en het Centraal Meldpunt (waar je zowel anoniem als op naam kunt melden)."}],tips:["Ga naar HINT via je browser: https://hint.hr.nl/nl/HR/Studie/keuzes-in-je-studie/Stage/stagediscriminatie/","Meldpunt formulier: https://forms.cloud.microsoft/e/fD8hpCT6WL","Erkenning gaat altijd vóór bewijslast. Jij bepaalt zelf welke stappen er volgen."],contactInfo:{naam:"HINT Themapagina Stagediscriminatie",contact:"https://hint.hr.nl/nl/HR/Studie/keuzes-in-je-studie/Stage/stagediscriminatie/",toelichting:"Officiële pagina van Hogeschool Rotterdam met handvatten, meldroutes en ondersteuning.",linkUrl:"https://hint.hr.nl/nl/HR/Studie/keuzes-in-je-studie/Stage/stagediscriminatie/",linkLabel:"Naar de HINT-pagina"}}},aanpak:{id:"aanpak",title:"Stagecode hbo",subtitle:"Kaders, afspraken en de norm van Hogeschool Rotterdam & Vereniging Hogescholen",badge:"Norm & Kader",externalUrl:{label:"Bekijk officiële Stagecode hbo (PDF)",url:"https://www.vereniginghogescholen.nl/system/knowledge_base/attachments/files/000/001/615/original/Stagecode_hbo.pdf?1779095526"},content:{inleiding:"Iedere student heeft recht op een veilige, inclusieve en gelijkwaardige stageplek. Hogeschool Rotterdam conformeert zich aan de Stagecode hbo en het landelijke Manifest Gelijke Kansen.",punten:[{kop:"1. Objectieve werving en selectie",tekst:"Stagebedrijven selecteren uitsluitend op basis van stage-eisen en competenties, zonder vooroordelen over achternaam, achtergrond, geslacht, hoofddoek of functiebeperking."},{kop:"2. Veilig leerklimaat",tekst:"Er heerst een nultolerantie voor discriminatie, uitsluiting, seksuele intimidatie of kleinerende opmerkingen op de werkvloer."},{kop:"3. Zorgplicht van de onderwijsinstelling",tekst:"Hogeschool Rotterdam heeft de plicht studenten te ondersteunen en in te grijpen zodra gelijke kansen of de veiligheid in gevaar komen."}],tips:["Bespreking van de Stagecode hbo is een vast onderdeel van het stagecontract.","Studenten lopen geen studievertraging op als een stage moet worden beëindigd door discriminatie.","De opleiding biedt actieve bemiddeling naar een vervangende stageplek."]}},meldpunt:{id:"meldpunt",title:"Meldpunt",subtitle:"Direct hulp, advies of een melding indienen",badge:"Centraal Meldpunt",externalUrl:{label:"Open meldingsformulier",url:"https://forms.cloud.microsoft/e/fD8hpCT6WL"},content:{inleiding:"Hogeschool Rotterdam heeft n.a.v. de stagecode een centraal en laagdrempelig meldpunt ingericht waar studenten discriminatie veilig, vertrouwelijk en desgewenst anoniem kunnen melden. Je bepaalt zelf welke stappen er wel of niet worden genomen.",punten:[{kop:"Optie 1: Centraal Meldpunt (Formulier - anoniem of op naam)",tekst:"Dien direct je melding in via het officiële online formulier van Hogeschool Rotterdam. Meldingen worden strikt vertrouwelijk behandeld en helpen patronen bij stagebedrijven in kaart te brengen en aan te pakken."},{kop:"Optie 2: Begeleider",tekst:"Je studentcoach, stagebegeleider of docent. Als je een snelle oplossing zoekt binnen je curriculum of samen een gesprek wilt voorbereiden."},{kop:"Optie 3: Vertrouwenspersoon Ongewenste Omgangsvormen",tekst:"Volledig onafhankelijk van je opleiding. Helpt je je gedachten op een rij te zetten en bespreekt in alle rust en vertrouwelijkheid mogelijke vervolgstappen."}],tips:["Direct meldingsformulier: https://forms.cloud.microsoft/e/fD8hpCT6WL","Kies zelf je vertrouwenspersoon via de officiële website van Hogeschool Rotterdam.","Centraal Meldpunt via HINT: https://hint.hr.nl/nl/HR/Studie/keuzes-in-je-studie/Stage/stagediscriminatie/","Landelijk: Discriminatie.nl / College voor de Rechten van de Mens."],contactInfo:{naam:"Centraal Meldpunt Stagediscriminatie",contact:"https://forms.cloud.microsoft/e/fD8hpCT6WL",toelichting:"Veilig, vertrouwelijk en laagdrempelig. Anoniem melden is altijd mogelijk.",linkUrl:"https://forms.cloud.microsoft/e/fD8hpCT6WL",linkLabel:"Naar het meldingsformulier"}}},tips:{id:"tips",title:"Gespreksvoering: NIVEA, OMA & LSD",subtitle:"Handvatten voor open, veilige en constructieve gesprekken",badge:"Methodiek",content:{inleiding:"Gesprekken over stagediscriminatie zijn kwetsbaar. Begeleiders en studenten kunnen onderstaande vuistregels hanteren om een veilig gesprek te garanderen.",punten:[{kop:"NIVEA - Niet Invullen Voor Een Ander",tekst:'Vul niet in wat de ander heeft gevoeld of bedoeld. Vraag open: "Wat gebeurde er precies?" en "Wat deed dat met jou?"'},{kop:"OMA - Oordeel, Mening en Advies uitstellen",tekst:'Ga niet direct in de verdediging of in de oplossingsmodus. Zeg niet: "Het zal vast niet zo bedoeld zijn". Erkenning gaat vóór bewijs.'},{kop:"LSD - Luisteren, Samenvatten, Doorvragen",tekst:"Luister zonder te onderbreken, vat in eigen woorden samen om begrip te verifiëren, en vraag door op wat de student nodig heeft."}],tips:["Laat stiltes vallen; geef de student de ruimte om woorden te zoeken.",'Vraag altijd: "Wie heeft op dit moment de regie en wat wil jij dat er gebeurt?"',"Sluit het gesprek af met een concrete datum voor een check-in (binnen 2 à 3 weken)."]}},route:{id:"route",title:"De Meldings- en Escalatie-route",subtitle:"Stapsgewijs van eerste vermoeden tot formele afronding",badge:"Stappenplan",content:{inleiding:"Wat zijn de opties als je discriminatie op stage ervaart? Je hebt altijd 4 verschillende routes tot je beschikking, afhankelijk van jouw behoefte:",punten:[{kop:"Route 1: Alleen stoom afblazen & sparren",tekst:"Je bespreekt het met je studentcoach of vertrouwenspersoon. Er wordt géén actie ondernomen richting het bedrijf. Je leert hoe je er zelf mee kunt omgaan."},{kop:"Route 2: Zelf het gesprek aangaan (met coaching)",tekst:"Je bereidt samen met je begeleider het gesprek voor met je stagebegeleider op de werkplek om grenzen aan te geven."},{kop:"Route 3: Het Driehoeksgesprek",tekst:"Jouw hogeschoolbegeleider zit samen met jou en de bedrijfsbegeleider om tafel. De school bewaakt jouw veiligheid en de Stagecode hbo."},{kop:"Route 4: Direct overstappen & formele melding",tekst:"Bij ernstige of onveilige situaties beëindigt de opleiding direct de stage. De school zorgt voor een alternatief zodat je studie geen vertraging oploopt."}],tips:["Jij mag op elk moment van route wisselen.","Niets gebeurt zonder jouw schriftelijke of mondelinge toestemming, behalve bij strafbare feiten.","De examencommissie kan dispensatie verlenen bij vervangende stageopdrachten."]}},signalen:{id:"signalen",title:"Signalenmatrix Stagediscriminatie",subtitle:"Herken subtiele, indirecte en directe vormen",badge:"Signalering",content:{inleiding:"Discriminatie is zelden openlijk expliciet; het uit zich vaak in micro-aggressies, dubbele standaarden of isolatie.",punten:[{kop:"Selectie & Aanname",tekst:'Opvallend vaak afgewezen worden met vage redenen ("past niet in het team", "accent"), terwijl medestudenten met vergelijkbare cijfers direct aangenomen worden.'},{kop:"Werkzaamheden & Beoordeling",tekst:"Structureel minderwaardige taken krijgen, buitengesloten worden van klantcontact of teamoverleggen, of onevenredig zwaar beoordeeld worden op kleine fouten."},{kop:"Cultuur & Opmerkingen",tekst:'"Grapjes" over afkomst, geloof of geaardheid; continu aangesproken worden als woordvoerder van een bepaalde groep; verbod op uitingen die niet wettelijk verboden zijn.'}],tips:['Vraag op terugkomdagen gericht: "Voel je je gezien en gehoord op de werkvloer?"',"Let op veranderingen in gedrag: verminderde aanwezigheid, stilvallen, ontwijkend antwoorden.","Twijfel is voldoende aanleiding voor een 1-op-1 verdiepend gesprek."]}},kader:{id:"kader",title:"Handelingskader Stagebegeleiding",subtitle:"Protocol en deadlines voor medewerkers",badge:"Protocol",content:{inleiding:"Wat doe je concreet als stagebegeleider of docent bij een melding of vermoeden van discriminatie?",punten:[{kop:"Dag 1 - 5: Het intakegesprek",tekst:"Plan binnen maximaal 5 werkdagen een vertrouwelijk gesprek met de student. Pas NIVEA en OMA toe. Onderzoek de behoefte van de student."},{kop:"Binnen 2 werkdagen na signaal: Registratie",tekst:"Meld het signaal (geanonimiseerd indien de student dat wenst) bij de stagecoördinator ten behoeve van de monitoring."},{kop:"Besluit binnen 10 werkdagen",tekst:"In afstemming met student en stagecoördinator: driehoeksgesprek plannen, stage ontbinden of afspraken bekrachtigen."}],tips:["Laat de student nooit alleen een confronterend gesprek voeren als die zich onveilig voelt.","Informeer de opleidingsmanager tijdig over potentiële escalaties.","Zorg altijd voor een nazorggesprek na 2 à 3 weken."]}},rodelijst:{id:"rodelijst",title:"Beleid Rode Lijst Stagebedrijven",subtitle:"Opschorting en beëindiging van samenwerkingsverbanden",badge:"Sanctiebeleid",content:{inleiding:'Hogeschool Rotterdam plaatst stageorganisaties op de "Rode Lijst" wanneer zij structureel of ernstig in gebreke blijven ten aanzien van gelijke stagekansen.',punten:[{kop:"Criterium 1: Herhaalde signalen",tekst:"Drie onafhankelijke signalen of klachten over dezelfde afdeling of organisatie binnen twee collegejaren."},{kop:"Criterium 2: Weigering dialoog",tekst:"Het bedrijf weigert mee te werken aan hoor en wederhoor of verwerpt de normen uit de Stagecode hbo."},{kop:"Consequentie: Uitsluiting",tekst:"Het bedrijf mag voor een periode van minimaal 2 jaar geen stages of afstudeeropdrachten aanbieden via de hogeschool. Plaatsing wordt schriftelijk gemotiveerd en vastgelegd door de opleidingsmanager."}],tips:["De rode lijst wordt centraal beheerd tussen alle domeinen en opleidingen.","Huidige studenten bij het betreffende bedrijf krijgen directe bemiddeling naar een veilige plek.","Signalen kunnen ook worden gemeld bij het Samenwerkingsverband Beroepsonderwijs Bedrijfsleven (SBB) of ELBHO."]}},decaan:{id:"decaan",title:"Decanaat & Studentondersteuning",subtitle:"Rechtsbescherming, financiële compensatie en mentale steun",badge:"Student Support",content:{inleiding:"Heb je nare ervaringen opgedaan of dreig je studievertraging op te lopen? Het studentendecanaat en studentpsychologen staan paraat.",punten:[{kop:"Studentendecanen",tekst:"Helpen bij financiële voorzieningen (zoals profileringsfonds bij vertraging door overmacht), examencommissieverzoeken en formele bezwaarprocedures."},{kop:"Studentpsychologen",tekst:"Laagdrempelige psychosociale ondersteuning bij stress, trauma of minderwaardigheidsgevoelens als gevolg van uitsluiting."},{kop:"Studieadviseurs",tekst:"Passen jouw individuele studieplanning aan zodat je je studiepunten behoudt."}],tips:["Afspraak maken: via HINT of mail naar studentendecanen@hr.nl","Inloopspreekuren op meerdere locaties (Museumpark, Kralingse Zoom, Academieplein).","Volledig kosteloos voor ingeschreven studenten van Hogeschool Rotterdam."]}},registratie:{id:"registratie",title:"Registratieprotocol Stagebureau",subtitle:"Vastlegging binnen 2 werkdagen voor patronenherkenning",badge:"Coördinatie",content:{inleiding:"Wat niet geregistreerd wordt, kan niet worden bestreden. Het stagebureau hanteert een strikt privacy-proof registratieprotocol.",punten:[{kop:"Stap 1: Registreren binnen 2 werkdagen",tekst:"Ieder signaal (formeel, informeel of anoniem) wordt gelogd in het beveiligde dossier van de organisatie."},{kop:"Stap 2: Categorisering",tekst:"Registratie op grond: herkomst/kleur, gender/geaardheid, beperking, levensbeschouwing, of algemeen onveilig werkklimaat."},{kop:"Stap 3: Trendanalyse",tekst:"Periodieke evaluatie met de opleidingsmanager: bij meerdere meldingen wordt preventief actie ondernomen."}],tips:["Privacy: persoonsgegevens van de student worden uitsluitend opgenomen met expliciete toestemming.","AVG-proof: gegevens worden niet publiek gedeeld, uitsluitend intern t.b.v. kwaliteitsbewaking en bescherming."]}},monitoring:{id:"monitoring",title:"Monitoring & Jaarlijkse Evaluatie",subtitle:"Beleidsmatige borging en verantwoording",badge:"Management",content:{inleiding:"Gelijke kansen vereisen continue monitoring van cijfers, signalen en uitstroomgegevens binnen alle domeinen.",punten:[{kop:"Kwartaaloverleg Opleidingsmanagers",tekst:"Bespreek trends uit het Centraal Meldpunt en de registraties van het stagebureau."},{kop:"Verantwoording in Jaarverslag",tekst:"Geanonimiseerde data over het aantal signalen, afhandelingstermijnen en getroffen sancties."},{kop:"Professionalisering docenten",tekst:"Vast scholingsaanbod inclusieve begeleiding en vooroordelenbewustzijn voor alle stagebegeleiders."}]}},klacht:{id:"klacht",title:"Klachtenprocedure & Externe Instanties",subtitle:"Formele escalatie bij ernstige misstanden",badge:"Rechtspositie",content:{inleiding:"Wanneer bemiddeling niet toereikend is of er sprake is van ernstige misstanden, kunnen formele stappen worden genomen.",punten:[{kop:"Klachtencommissie Ongewenst Gedrag HR",tekst:"Onderzoekt formele klachten en adviseert het College van Bestuur over passende maatregelen."},{kop:"College voor de Rechten van de Mens",tekst:"Onafhankelijk nationaal orgaan dat een bindend juridisch oordeel kan vellen over ongelijke behandeling."},{kop:"Inspectie van het Onderwijs",tekst:"Houdt toezicht op de zorgplicht van hogescholen m.b.t. sociale veiligheid."}]}}},ck=[vs,FA,IA,QA,ZA],dk=({stappen:o,onOpenAction:l})=>y.jsxDEV("section",{"aria-label":"Vijf opeenvolgende fasen van de routekaart",children:y.jsxDEV("div",{className:"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3.5 mb-5 stappen-grid",children:o.map((s,u)=>{const f=hs[u]||hs[0],p=ck[u]||vs;return y.jsxDEV("article",{className:"stap-card bg-white border-2 border-[#D1C7BA] rounded-xl overflow-hidden flex flex-col shadow-xs transition-all duration-150 hover:shadow-md",style:{borderColor:f.borderColor},children:[y.jsxDEV("div",{className:"flex items-center gap-2.5 px-3.5 py-2.5 border-b min-h-[66
