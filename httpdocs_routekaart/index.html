0] shrink-0">C.</strong><span>Driehoeksgesprek met stagebedrijf</span></li><li class="flex items-baseline gap-2"><strong class="font-bold text-[#A87500] shrink-0">D.</strong><span>Officiële melding doen</span></li></ul><p class="mt-2 text-[#003340] font-semibold">Bespreek je keuze.</p>'},{id:"student-5",titel:"Koppel terug",kern:"Na 2 à 3 weken check je in met je begeleider.",detail:'<p>Hoe gaat het nu? Heb je nog steun nodig? Je staat er nooit alleen voor.</p><p class="mt-2 pt-2 border-t border-[#E4DDD2]">Heb je er toch last van en beïnvloedt het jouw studie? Neem dan contact op met het <a href="https://www.hogeschoolrotterdam.nl/voorlichting/begeleiding-en-voorzieningen/decaan/" target="_blank" rel="noopener noreferrer" class="font-bold text-[#006E66] underline hover:text-[#004D47] inline-flex items-center gap-0.5">decanaat <svg class="w-3 h-3 inline shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg></a>.</p>'}],blokken:[{t:"Studentcoach, stagebegeleider, stagecoördinator",i:"Je eerste aanspreekpunt. Plant binnen 5 werkdagen een gesprek.",b:!0},{t:"Vertrouwenspersoon",i:'Onafhankelijk en vertrouwelijk. Ook buiten de opleiding om. Kies zelf een <a href="https://hint.hr.nl/nl/HR/Over-de-HR/De-Organisatie/Contactpersonen/vertrouwenspersonen/" target="_blank" rel="noopener noreferrer" class="font-bold underline">vertrouwenspersoon</a>.'},{t:"Centraal meldpunt",i:'Anoniem of op naam. Meld direct via het <a href="https://forms.cloud.microsoft/e/fD8hpCT6WL" target="_blank" rel="noopener noreferrer" class="font-bold underline">meldpunt</a>.'}]},{id:"begeleider",naam:"Begeleider",rol:"Studentcoach, stagebegeleider, stagecoördinator, docent",icoon:"UserCheck",vraag:"Wat doe ik als een student stagediscriminatie ervaart of vermoedt?",letOp:"Acuut onveilig? Schakel direct op naar de opleidingsmanager.",stappen:[{id:"begeleider-1",titel:"Bewustwording en preventie",kern:"Gelijke stagekansen is een gezamenlijke verantwoordelijkheid.",detail:"<p>De HR-brede aanpak laat zien wat er van jou wordt verwacht aan kennis, handelen en houding.</p>",actie:"Ga naar aanpak",actieType:"aanpak"},{id:"begeleider-2",titel:"Signaleren",kern:"Vraag actief door tijdens gesprekken en terugkomdagen.",detail:"<p>Let op signalen in de sollicitatiefase én tijdens de stage. Bij een signaal: plan binnen 5 werkdagen een gesprek. Bevestig dat je het serieus neemt.</p>",actie:"Ga naar aanpak",actieType:"aanpak"},{id:"begeleider-3",titel:"Gespreksvoering",kern:"Er is geen bewijs nodig om het gesprek te voeren.",detail:"<p>Wat wil de student? Erover praten? Oefenen? Officiële melding?</p><p>De student houdt regie over de stappen.</p>",actie:"Ga naar aanpak",actieType:"aanpak"},{id:"begeleider-4",titel:"Begeleiding",kern:"Wat wil de student?",detail:'<ul class="space-y-1 text-[12px]"><li><b>A.</b> (Nog) niets doen</li><li><b>B.</b> Zelf het gesprek voeren</li><li><b>C.</b> Driehoeksgesprek met stagebedrijf</li><li><b>D.</b> Officiële melding doen</li></ul>',actie:"Ga naar aanpak",actieType:"aanpak"},{id:"begeleider-5",titel:"(Na)zorg",kern:"Hoe gaat het nu?",detail:'<p>Hoe gaat het nu? Heeft de student er aanhoudend last van en beïnvloedt het de studie? Verwijs door naar het <a href="https://www.hogeschoolrotterdam.nl/voorlichting/begeleiding-en-voorzieningen/studentendecanen/" target="_blank" rel="noopener noreferrer">decanaat</a>.</p>',actie:"Ga naar aanpak",actieType:"aanpak"}],blokken:[{t:"Regie bij de student",i:"De student bepaalt de vervolgstappen, behalve bij acute onveiligheid."},{t:"Empathie vóór bewijs",i:"Erkenning en luisteren gaan altijd vóór waarheidsvinding of bewijslast. Een vermoeden rechtvaardigt al een gesprek."},{t:"Onafhankelijkheid",i:"Het belang en welzijn van de student gaat vóór de relatie met het stagebedrijf. Altijd."},{t:"Documenteer met toestemming",i:"Leg feiten en af rtrouwt",tekst:"Bespreek je situatie in alle rust met een vriend, ouder, medestudent of docent/studentcoach. Je hoeft het niet alleen te verwerken of op te lossen."},{kop:"Directe ondersteuning en contact",tekst:"Via de HINT-pagina vind je rechtstreekse contactgegevens van vertrouwenspersonen en het Centraal Meldpunt (waar je zowel anoniem als op naam kunt melden)."}],tips:["Ga naar HINT via je browser: https://hint.hr.nl/nl/HR/Studie/keuzes-in-je-studie/Stage/stagediscriminatie/","Meldpunt formulier: https://forms.cloud.microsoft/e/fD8hpCT6WL","Erkenning gaat altijd vóór bewijslast. Jij bepaalt zelf welke stappen er volgen."],contactInfo:{naam:"HINT Themapagina Stagediscriminatie",contact:"https://hint.hr.nl/nl/HR/Studie/keuzes-in-je-studie/Stage/stagediscriminatie/",toelichting:"Officiële pagina van Hogeschool Rotterdam met handvatten, meldroutes en ondersteuning.",linkUrl:"https://hint.hr.nl/nl/HR/Studie/keuzes-in-je-studie/Stage/stagediscriminatie/",linkLabel:"Naar de HINT-pagina"}}},aanpak:{id:"aanpak",title:"Aanpak",subtitle:"",badge:"Aanpak",content:{inleiding:"Deze pagina is momenteel leeg. Het bijbehorende document wordt later toegevoegd.",punten:[]}},meldpunt:{id:"meldpunt",title:"Meldpunt",subtitle:"Direct hulp, advies of een melding indienen",badge:"Centraal Meldpunt",externalUrl:{label:"Open meldingsformulier",url:"https://forms.cloud.microsoft/e/fD8hpCT6WL"},content:{inleiding:"Hogeschool Rotterdam heeft n.a.v. de stagecode een centraal en laagdrempelig meldpunt ingericht waar studenten discriminatie veilig, vertrouwelijk en desgewenst anoniem kunnen melden. Je bepaalt zelf welke stappen er wel of niet worden genomen.",punten:[{kop:"Optie 1: Centraal Meldpunt (Formulier - anoniem of op naam)",tekst:"Dien direct je melding in via het officiële online formulier van Hogeschool Rotterdam. Meldingen worden strikt vertrouwelijk behandeld en helpen patronen bij stagebedrijven in kaart te brengen en aan te pakken."},{kop:"Optie 2: Begeleider",tekst:"Je studentcoach, stagebegeleider of docent. Als je een snelle oplossing zoekt binnen je curriculum of samen een gesprek wilt voorbereiden."},{kop:"Optie 3: Vertrouwenspersoon Ongewenste Omgangsvormen",tekst:"Volledig onafhankelijk van je opleiding. Helpt je je gedachten op een rij te zetten en bespreekt in alle rust en vertrouwelijkheid mogelijke vervolgstappen."}],tips:["Direct meldingsformulier: https://forms.cloud.microsoft/e/fD8hpCT6WL","Kies zelf je vertrouwenspersoon via de officiële website van Hogeschool Rotterdam.","Centraal Meldpunt via HINT: https://hint.hr.nl/nl/HR/Studie/keuzes-in-je-studie/Stage/stagediscriminatie/","Landelijk: Discriminatie.nl / College voor de Rechten van de Mens."],contactInfo:{naam:"Centraal Meldpunt Stagediscriminatie",contact:"https://forms.cloud.microsoft/e/fD8hpCT6WL",toelichting:"Veilig, vertrouwelijk en laagdrempelig. Anoniem melden is altijd mogelijk.",linkUrl:"https://forms.cloud.microsoft/e/fD8hpCT6WL",linkLabel:"Naar het meldingsformulier"}}},tips:{id:"tips",title:"Gespreksvoering: NIVEA, OMA & LSD",subtitle:"Handvatten voor open, veilige en constructieve gesprekken",badge:"Methodiek",content:{inleiding:"Gesprekken over stagediscriminatie zijn kwetsbaar. Begeleiders en studenten kunnen onderstaande vuistregels hanteren om een veilig gesprek te garanderen.",punten:[{kop:"NIVEA - Niet Invullen Voor Een Ander",tekst:'Vul niet in wat de ander heeft gevoeld of bedoeld. Vraag open: "Wat gebeurde er precies?" en "Wat deed dat met jou?"'},{kop:"OMA - Oordeel, Mening en Advies uitstellen",tekst:'Ga niet direct in de verdediging of in de oplossingsmodus. Zeg niet: "Het zal vast niet zo bedoeld zijn". Erkenning gaat vóór bewijs.'},{kop:"LSD - Luisteren, Samenvatten, Doorvragen",tekst:"Luister zonder te onderbreken, vat in eigen woorden samen om begrip te verifiëren, en vraag door op wat de student nodig heeft."}],tips:["Laat stiltes vallen; geef de student de ruimte om woorden te zoeken.",'Vraag altijd: "Wie heeft op dit moment de regie en wat wil jij dat er gebeurt?"',"Sluit het gesprek af met een concrete datum voor een check-in (binnen 2 à 3 weken)."]}},route:{id:"route",title:"De Meldings- en Escalatie-route",subtitle:"Stapsgewijs van eerste vermoeden tot formele afronding",badge:"Stappenplan",content:{inleiding:"Wat zijn de opties als je discriminatie op stage ervaart? Je hebt altijd 4 verschillende routes tot je beschikking, afhankelijk van jouw behoefte:",punten:[{kop:"Route 1: Alleen stoom afblazen & sparren",tekst:"Je bespreekt het met je studentcoach of vertrouwenspersoon. Er wordt géén actie ondernomen richting het bedrijf. Je leert hoe je er zelf mee kunt omgaan."},{kop:"Route 2: Zelf het gesprek aangaan (met coaching)",tekst:"Je bereidt samen met je begeleider het gesprek voor met je stagebegeleider op de werkplek om grenzen aan te geven."},{kop:"Route 3: Het Driehoeksgesprek",tekst:"Jouw hogeschoolbegeleider zit samen met jou en de bedrijfsbegeleider om tafel. De school bewaakt jouw veiligheid en de Stagecode hbo."},{kop:"Route 4: Direct overstappen & formele melding",tekst:"Bij ernstige of onveilige situaties beëindigt de opleiding direct de stage. De school zorgt voor een alternatief zodat je studie geen vertraging oploopt."}],tips:["Jij mag op elk moment van route wisselen.","Niets gebeurt zonder jouw schriftelijke of mondelinge toestemming, behalve bij strafbare feiten.","De examencommissie kan dispensatie verlenen bij vervangende stageopdrachten."]}},signalen:{id:"signalen",title:"Signalenmatrix Stagediscriminatie",subtitle:"Herken subtiele, indirecte en directe vormen",badge:"Signalering",content:{inleiding:"Discriminatie is zelden openlijk expliciet; het uit zich vaak in micro-aggressies, dubbele standaarden of isolatie.",punten:[{kop:"Selectie & Aanname",tekst:'Opvallend vaak afgewezen worden met vage redenen ("past niet in het team", "accent"), terwijl medestudenten met vergelijkbare cijfers direct aangenomen worden.'},{kop:"Werkzaamheden & Beoordeling",tekst:"Structureel minderwaardige taken krijgen, buitengesloten worden van klantcontact of teamoverleggen, of onevenredig zwaar beoordeeld worden op kleine fouten."},{kop:"Cultuur & Opmerkingen",tekst:'"Grapjes" over afkomst, geloof of geaardheid; continu aangesproken worden als woordvoerder van een bepaalde groep; verbod op uitingen die niet wettelijk verboden zijn.'}],tips:['Vraag op terugkomdagen gericht: "Voel je je gezien en gehoord op de werkvloer?"',"Let op veranderingen in gedrag: verminderde aanwezigheid, stilvallen, ontwijkend antwoorden.","Twijfel is voldoende aanleiding voor een 1-op-1 verdiepend gesprek."]}},kader:{id:"kader",title:"Handelingskader Stagebegeleiding",subtitle:"Protocol en deadlines voor medewerkers",badge:"Protocol",content:{inleiding:"Wat doe je concreet als stagebegeleider of docent bij een melding of vermoeden van discriminatie?",punten:[{kop:"Dag 1 - 5: Het intakegesprek",tekst:"Plan binnen maximaal 5 werkdagen een vertrouwelijk gesprek met de student. Pas NIVEA en OMA toe. Onderzoek de behoefte van de student."},{kop:"Binnen 2 werkdagen na signaal: Registratie",tekst:"Meld het signaal (geanonimiseerd indien de student dat wenst) bij de stagecoördinator ten behoeve van de monitoring."},{kop:"Besluit binnen 10 werkdagen",tekst:"In afstemming met student en stagecoördinator: driehoeksgesprek plannen, stage ontbinden of afspraken bekrachtigen."}],tips:["Laat de student nooit alleen een confronterend gesprek voeren als die zich onveilig voelt.","Informeer de opleidingsmanager tijdig over potentiële escalaties.","Zorg altijd voor een nazorggesprek na 2 à 3 weken."]}},rodelijst:{id:"rodelijst",title:"Beleid Rode Lijst Stagebedrijven",subtitle:"Opschorting en beëindiging van samenwerkingsverbanden",badge:"Sanctiebeleid",content:{inleiding:'Hogeschool Rotterdam plaatst stageorganisaties op de "Rode Lijst" wanneer zij structureel of ernstig in gebreke blijven ten aanzien van gelijke stagekansen.',punten:[{kop:"Criterium 1: Herhaalde signalen",tekst:"Drie onafhankelijke signalen of klachten over dezelfde afdeling of organisatie binnen twee collegejaren."},{kop:"Criterium 2: Weigering dialoog",tekst:"Het bedrijf weigert mee te werken aan hoor en wederhoor of verwerpt de normen uit de Stagecode hbo."},{kop:"Consequentie: Uitsluiting",tekst:"Het bedrijf mag voor een periode van minimaal 2 jaar geen stages of afstudeeropdrachten aanbieden via de hogeschool. Plaatsing wordt schriftelijk gemotiveerd en vastgelegd door de opleidingsmanager."}],tips:["De rode lijst wordt centraal beheerd tussen alle domeinen en opleidingen.","Huidige studenten bij het betreffende bedrijf krijgen directe bemiddeling naar een veilige plek.","Signalen kunnen ook worden gemeld bij het Samenwerkingsverband Beroepsonderwijs Bedrijfsleven (SBB) of ELBHO."]}},decaan:{id:"decaan",title:"Decanaat & Studentondersteuning",subtitle:"Rechtsbescherming, financiële compensatie en mentale steun",badge:"Student Support",content:{inleiding:"Heb je nare ervaringen opgedaan of dreig je studievertraging op te lopen? Het studentendecanaat en studentpsychologen staan paraat.",punten:[{kop:"Studentendecanen",tekst:"Helpen bij financiële voorzieningen (zoals profileringsfonds bij vertraging door overmacht), examencommissieverzoeken en formele bezwaarprocedures."},{kop:"Studentpsychologen",tekst:"Laagdrempelige psychosociale ondersteuning bij stress, trauma of minderwaardigheidsgevoelens als gevolg van uitsluiting."},{kop:"Studieadviseurs",tekst:"Passen jouw individuele studieplanning aan zodat je je studiepunten behoudt."}],tips:["Afspraak maken: via HINT of mail naar studentendecanen@hr.nl","Inloopspreekuren op meerdere locaties (Museumpark, Kralingse Zoom, Academieplein).","Volledig kosteloos voor ingeschreven studenten van Hogeschool Rotterdam."]}},registratie:{id:"registratie",title:"Registratieprotocol Stagebureau",subtitle:"Vastlegging binnen 2 werkdagen voor patronenherkenning",badge:"Coördinatie",content:{inleiding:"Wat niet geregistreerd wordt, kan niet worden bestreden.
